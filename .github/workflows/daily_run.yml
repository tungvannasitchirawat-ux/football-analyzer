name: Daily Football Analysis Auto-Run

on:
  schedule:
    # ตั้งเวลารันทุกวัน เวลา 00:00 UTC (07:00 น. เวลาไทย)
    - cron: '0 0 * * *'
  workflow_dispatch: # ปุ่มกดสั่งรันเองได้ด้วยตนเอง

jobs:
  run-scraping:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run main script
        run: python main.py

      - name: Commit and push generated CSV
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/*.csv
          git commit -m "Auto-update daily football analysis [skip ci]" || exit 0
          git push
